services:
  postgres:
    image: postgres:16
    container_name: order-service-postgres
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: order
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    volumes:
      - order-service-postgres-data:/var/lib/postgresql/data

volumes:
  order-service-postgres-data: