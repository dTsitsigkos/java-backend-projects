name: Java CI

on:
  push:
    branches: ["master"]

  pull_request:
    branches: ["master"]

permissions:
  contents: read
  packages: write

jobs:
  test:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: industry
          POSTGRES_USER: industry
          POSTGRES_PASSWORD: industry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U industry -d industry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and tests
        working-directory: user-crud-api
        run: ./mvnw clean package

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/dtsitsigkos/user-crud-api:${{ github.sha }} \
            ./backend

      - name: Push Docker image
        run: |
          docker push ghcr.io/dtsitsigkos/user-crud-api:${{ github.sha }}
